name: Python tests

on:
  push:
    branches:
      - feat/windows-iphone-diagnostics
      - feat/cve-2025-43534-scope-check
  pull_request:
    branches:
      - main
      - feat/windows-iphone-diagnostics

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python files
        run: python -m compileall -q diagnostics.py cve_scope.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
